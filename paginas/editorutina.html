<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enjoy — Editor de Rutina</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/editorutina.css">
    <script src="../js/app.js" defer></script>
</head>
<body>

<!-- ===== TOPBAR ===== -->
<header class="ed-topbar">
    <a href="planificacion.html" class="ed-back" id="edBackBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
        </svg>
        Planificación
    </a>
    <div class="ed-header-info">
        <h1 class="ed-nombre" id="edNombre">Cargando…</h1>
        <span class="ed-dias-badge" id="edDias"></span>
    </div>
    <div class="ed-topbar-right">
        <span class="ed-saved-hint" id="edSavedHint" hidden>Guardado ✓</span>
        <button class="ed-icon-btn" id="btnConfig" aria-label="Configuración de plantilla">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
            </svg>
        </button>
    </div>
</header>

<!-- ===== PESTAÑAS DE DÍAS ===== -->
<div class="ed-tabs-wrap">
    <div class="ed-tab-list" id="edTabList" role="tablist" aria-label="Días de entrenamiento"></div>
</div>

<!-- ===== CONTENIDO PRINCIPAL ===== -->
<main class="ed-main">
    <div class="ed-content">

        <div class="ed-card">
            <div class="ed-card-header">
                <span class="ed-card-title" id="edDayTitle">Día 1</span>
                <div class="ed-card-header-right">
                    <button class="ed-dup-day-btn" id="btnDuplicarDia" title="Duplicar este día" aria-label="Duplicar este día">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                        Duplicar día
                    </button>
                    <button class="ed-del-day-btn" id="btnEliminarDia" title="Eliminar este día" aria-label="Eliminar este día">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        Eliminar día
                    </button>
                    <span class="ed-ej-count" id="edEjCount" aria-live="polite">0 ejercicios</span>
                </div>
            </div>

            <div class="ed-ej-list" id="edEjList" role="list"></div>

            <div class="ed-empty" id="edEmpty" hidden>
                <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29z"/></svg>
                <p>Sin ejercicios en este día.<br>Agregá el primero.</p>
            </div>

            <button class="ed-add-btn" id="btnAgregarEj">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                Agregar ejercicio
            </button>
        </div>

    </div>
</main>

<!-- ===== MODAL CONFIGURACIÓN ===== -->
<div class="ed-overlay" id="configOverlay" aria-hidden="true">
    <div class="ed-panel" role="dialog" aria-modal="true" aria-labelledby="configTitle">
        <button class="ed-close" id="configClose" aria-label="Cerrar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <h3 class="ed-panel-title" id="configTitle">Configuración</h3>
        <form class="ed-form" id="configForm" novalidate>
            <div class="ed-form-group">
                <label for="cfgNombre">Nombre de la plantilla *</label>
                <input type="text" id="cfgNombre" placeholder="Ej: Full Body 3 Días" required>
                <span class="ed-field-error" id="cfgNombreError">El nombre es obligatorio.</span>
            </div>
            <div class="ed-form-group">
                <label for="cfgDesc">Descripción</label>
                <textarea id="cfgDesc" rows="3" placeholder="Describe el objetivo del programa..."></textarea>
            </div>
            <div class="ed-form-actions">
                <button type="button" class="ed-btn ed-btn-secondary" id="configCancel">Cancelar</button>
                <button type="submit" class="ed-btn ed-btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</div>

<!-- ===== MODAL AGREGAR EJERCICIO ===== -->
<div class="ed-overlay" id="searchOverlay" aria-hidden="true">
    <div class="ed-panel ed-panel--wide" role="dialog" aria-modal="true" aria-labelledby="searchTitle">
        <button class="ed-close" id="searchClose" aria-label="Cerrar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <h3 class="ed-panel-title" id="searchTitle">Agregar Ejercicio</h3>

        <div class="ed-search-wrap">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="search" class="ed-search-input" id="ejSearch" placeholder="Buscar por nombre o músculo…" aria-label="Buscar ejercicio">
        </div>

        <div class="ej-db-list" id="ejDbList" role="list"></div>
    </div>
</div>

<!-- ===== MODAL EDITAR EJERCICIO ===== -->
<div class="ed-overlay" id="editEjOverlay" aria-hidden="true">
    <div class="ed-panel ed-panel--narrow" role="dialog" aria-modal="true" aria-labelledby="editEjTitle">
        <button class="ed-close" id="editEjClose" aria-label="Cerrar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <h3 class="ed-panel-title" id="editEjTitle">Editar ejercicio</h3>
        <p class="ed-panel-subtitle" id="editEjNombre"></p>
        <p class="ed-panel-musculo" id="editEjMusculo"></p>

        <div class="ed-form ed-form--ej">
            <div class="ed-form-row">
                <div class="ed-form-group">
                    <label for="ejSeries">Series</label>
                    <input type="number" id="ejSeries" min="1" max="20" value="3">
                </div>
                <div class="ed-form-group">
                    <label for="ejReps">Repeticiones</label>
                    <input type="text" id="ejReps" placeholder="Ej: 8–12">
                </div>
            </div>
            <div class="ed-form-group">
                <label for="ejDescanso">Descanso</label>
                <input type="text" id="ejDescanso" placeholder="Ej: 90 s">
            </div>
            <div class="ed-form-actions ed-form-actions--split">
                <button class="ed-btn ed-btn-danger-ghost" id="editEjDelete">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    Eliminar
                </button>
                <div class="ed-form-actions-right">
                    <button class="ed-btn ed-btn-secondary" id="editEjCancel">Cancelar</button>
                    <button class="ed-btn ed-btn-primary" id="editEjSave">Guardar</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ===== TOAST ===== -->
<div class="ed-toast" id="edToast" role="status" aria-live="polite" hidden></div>

</body>
</html>
